name: Build and Publish WASM Package

# Triggers on published GitHub releases (e.g. v1.2.3 tags).
# Required secrets:
#   NPM_TOKEN — npm automation token with "publish" permission.
#               Generate at https://www.npmjs.com/settings/<user>/tokens
on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-publish:
    name: Build, Test, and Publish WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Rust toolchain
      # -----------------------------------------------------------------------
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "wasm-cache"

      # -----------------------------------------------------------------------
      # wasm-pack
      # -----------------------------------------------------------------------
      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack --version

      # -----------------------------------------------------------------------
      # Build
      # -----------------------------------------------------------------------
      - name: Build WASM package (web target)
        run: wasm-pack build crates/wasm --target web --release
        # Output: crates/wasm/pkg/
        # The pkg/ directory contains:
        #   grat_wasm_bg.wasm — compiled WASM binary
        #   grat_wasm.js      — JS bindings generated by wasm-bindgen
        #   grat_wasm.d.ts    — TypeScript type definitions
        #   package.json      — npm package manifest

      # -----------------------------------------------------------------------
      # Test
      # -----------------------------------------------------------------------
      - name: Run WASM tests (headless Chrome)
        run: wasm-pack test crates/wasm --headless --chrome
        # Runs #[wasm_bindgen_test] annotated tests in a headless browser.
        # Install Chrome on the runner (ubuntu-latest ships with it by default).

      # -----------------------------------------------------------------------
      # Upload artifact
      # -----------------------------------------------------------------------
      - name: Upload WASM pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: crates/wasm/pkg/
          retention-days: 30

      # -----------------------------------------------------------------------
      # Publish to npm
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        working-directory: crates/wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
        # Publishes the generated pkg/ as an npm package.
        # The package name and version come from crates/wasm/pkg/package.json,
        # which wasm-pack generates from Cargo.toml metadata.
