name: Build and Publish WASM Package

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      rust_version: ${{ steps.rust.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve shared build inputs
        id: rust
        run: |
          rust_version=$(rustc +stable --version | cut -d ' ' -f 2)
          echo "version=$rust_version" >> "$GITHUB_OUTPUT"
          cargo +stable generate-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-cargo-lock
          path: Cargo.lock
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wasm_pack: ['0.14.0', '0.15.0']
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.prepare.outputs.rust_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: wasm-cargo-lock
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-pack-${{ matrix.wasm_pack }}
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: ${{ matrix.wasm_pack }}
        run: |
          archive="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${archive}.tar.gz" \
            --output "$RUNNER_TEMP/wasm-pack.tar.gz"
          tar -xzf "$RUNNER_TEMP/wasm-pack.tar.gz" -C "$RUNNER_TEMP"
          install "$RUNNER_TEMP/$archive/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
      - name: Build WASM package
        run: wasm-pack build crates/wasm --target web --release --locked
      - name: Run WASM browser tests
        if: matrix.wasm_pack == '0.15.0'
        run: wasm-pack test crates/wasm --headless --chrome --locked
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg-${{ matrix.wasm_pack }}
          path: crates/wasm/pkg/
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wasm-pkg-*
          path: packages
      - name: Compare WebAssembly and JavaScript output
        run: |
          for package in packages/wasm-pkg-*; do
            (
              cd "$package"
              sha256sum ./*.wasm ./*.js > ../"${package##*/}.sha256"
            )
          done
          diff -u packages/wasm-pkg-0.14.0.sha256 packages/wasm-pkg-0.15.0.sha256
          cp packages/wasm-pkg-0.15.0.sha256 wasm-sha256sums.txt
      - name: Attach checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" wasm-sha256sums.txt --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg-0.15.0
          path: pkg
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the verified package to npm
        working-directory: pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
