name: Decode Benchmarks

on:
  push:
    branches: [main]
    paths:
      - "crates/core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/benchmark.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/benchmark.yml"
  workflow_run:
    workflows: [Decode Benchmarks]
    types: [completed]

jobs:
  benchmark:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Set Cargo target directory
        run: printf 'CARGO_TARGET_DIR=%s/cargo-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out benchmark revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ${{ env.CARGO_TARGET_DIR }}
          shared-key: decode-benchmarks

      - name: Restore Criterion baseline for the base commit
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CARGO_TARGET_DIR }}/criterion
          key: decode-baseline-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.base.sha || github.sha }}

      - name: Benchmark main revision
        if: steps.baseline.outputs.cache-hit != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/baseline" "$BASE_SHA"
          cargo bench --manifest-path "$RUNNER_TEMP/baseline/Cargo.toml" -p grat-core --bench decode_pipeline -- --save-baseline main

      - name: Cache main baseline
        if: github.event_name == 'push' && steps.baseline.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CARGO_TARGET_DIR }}/criterion
          key: ${{ steps.baseline.outputs.cache-primary-key }}

      - name: Benchmark pull request
        if: github.event_name == 'pull_request'
        run: cargo bench -p grat-core --bench decode_pipeline -- --save-baseline pr

      - name: Compare results and enforce regression limit
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ["CARGO_TARGET_DIR"]) / "criterion"
          report = ["## Decode benchmark comparison", "", "Compared with the PR base revision; regressions above 10% fail this check.", "", "| Benchmark | Base (ns) | PR (ns) | Change |", "| --- | ---: | ---: | ---: |"]
          regressions = []
          compared = 0

          for baseline_file in sorted(root.rglob("main/estimates.json")):
              candidate_file = baseline_file.parent.parent / "pr" / "estimates.json"
              if not candidate_file.is_file():
                  continue
              baseline = json.loads(baseline_file.read_text())["mean"]["point_estimate"]
              candidate = json.loads(candidate_file.read_text())["mean"]["point_estimate"]
              change = (candidate / baseline - 1) * 100 if baseline else 0
              name = "/".join(baseline_file.relative_to(root).parts[:-2])
              report.append(f"| `{name}` | {baseline:.0f} | {candidate:.0f} | {change:+.2f}% |")
              compared += 1
              if change > 10:
                  regressions.append(f"{name}: {change:.2f}%")

          if compared == 0:
              report.extend(["", "No paired Criterion estimates were found."])
              Path("benchmark-report.md").write_text("\n".join(report) + "\n")
              print("::error::No paired Criterion estimates were found")
              sys.exit(1)

          if regressions:
              report.extend(["", "Regressions above 10%:", *[f"- {item}" for item in regressions]])
          else:
              report.extend(["", "No benchmark regressed by more than 10%."])

          markdown = "\n".join(report) + "\n"
          Path("benchmark-report.md").write_text(markdown)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(markdown)

          if regressions:
              print("::error::Performance regression exceeded 10%: " + ", ".join(regressions))
              sys.exit(1)
          PY

      - name: Upload benchmark report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-report.md
          if-no-files-found: ignore
          retention-days: 14

  comment:
    needs: benchmark
    if: >-
      always() && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Download benchmark report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}

      - name: Comment on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            let pullRequest = context.payload.pull_request;
            if (run) {
              if (!run.head_repository || run.head_repository.full_name === `${owner}/${repo}`) return;
              const candidates = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', base: 'main',
                head: `${run.head_repository.owner.login}:${run.head_branch}`
              });
              pullRequest = candidates.find((pr) => pr.head.sha === run.head_sha);
            }
            if (!pullRequest) return;
            const reportPath = 'benchmark-results/benchmark-report.md';
            const report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : 'The benchmark job did not produce a report. Check its workflow run for build or benchmark errors.';
            const marker = '<!-- prism-decode-benchmark -->';
            const body = `${marker}\n${report}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pullRequest.number
            });
            const previous = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pullRequest.number, body });
            }
