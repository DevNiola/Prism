name: Publish Container Images

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: [server, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Set image metadata
        id: image
        env:
          APP: ${{ matrix.app }}
        run: |
          version=${RELEASE_TAG#v}
          if [[ ! $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] ||
             (( ${#version} > 128 )); then
            echo "::error::Expected a container-compatible SemVer release tag"
            exit 1
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}-$APP"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$image:sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version_tag=$image:$version" >> "$GITHUB_OUTPUT"
          if [[ $version != *-* ]]; then
            echo "latest_tag=$image:latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push multi-platform image with SBOM
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.sha_tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          sbom: true
          cache-from: type=gha,scope=prism-${{ matrix.app }}
          cache-to: type=gha,scope=prism-${{ matrix.app }},mode=max
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign image index with GitHub OIDC
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Publish release tags for the signed digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION_TAG: ${{ steps.image.outputs.version_tag }}
          LATEST_TAG: ${{ steps.image.outputs.latest_tag }}
        run: |
          tags=(--tag "$VERSION_TAG")
          if [[ -n "$LATEST_TAG" ]]; then
            tags+=(--tag "$LATEST_TAG")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"
