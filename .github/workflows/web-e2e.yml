name: Web E2E

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter grat-web exec playwright install --with-deps chromium
      - run: pnpm --filter grat-web test:e2e