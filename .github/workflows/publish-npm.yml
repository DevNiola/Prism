name: Publish npm packages

on:
  release:
    types: [published]

# id-token: write is required for npm --provenance (OIDC-linked publish).
# contents: read is sufficient for checkout.
permissions:
  contents: read
  id-token: write

jobs:
  publish-server:
    name: Publish server package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server package
        run: pnpm --filter grat-server build

      # --provenance links the published package to this exact workflow run
      # via an OIDC-signed attestation stored on the npm registry. Consumers
      # can verify build origin with: npm audit signatures grat-server
      - name: Publish server package
        working-directory: apps/server
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published version
        working-directory: apps/server
        run: npm view "grat-server@$(node -p 'require("./package.json").version')" version

      - name: Compute release SHA256 digest
        working-directory: apps/server
        run: |
          PKG="grat-server-$(node -p 'require("./package.json").version').tgz"
          npm pack --dry-run 2>/dev/null || true
          npm pack --silent
          sha256sum "$PKG" | tee /tmp/grat-server.sha256
          echo "::notice title=grat-server SHA256::$(cat /tmp/grat-server.sha256)"
