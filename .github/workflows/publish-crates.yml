name: Publish Crates

'on':
  pull_request:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/publish-crates.yml'
  release:
    types:
      - published
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (do not publish to crates.io)'
        type: boolean
        default: false
        required: false

concurrency:
  group: publish-crates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry-run-check:
    name: Dry-Run Crate Packaging & Publishing
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Dry-run publish grat-core
        run: cargo publish -p grat-core --dry-run

      - name: Dry-run publish grat-wasm
        run: cargo publish -p grat-wasm --dry-run

      - name: Dry-run publish grat (CLI)
        run: cargo publish -p grat --dry-run

  publish-crates:
    name: Publish Crates to crates.io
    runs-on: ubuntu-latest
    if: (github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) && github.repository == 'DevNiola/Prism'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Verify CARGO_REGISTRY_TOKEN secret
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is missing or empty. Please configure it in repository secrets."
            exit 1
          fi

      - name: Publish grat-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "[+] Publishing grat-core to crates.io..."
          cargo publish -p grat-core --token "$CARGO_REGISTRY_TOKEN"
          echo "[+] Sleeping 30s to allow crates.io index to update before dependent crates..."
          sleep 30

      - name: Publish grat-wasm
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "[+] Publishing grat-wasm to crates.io..."
          cargo publish -p grat-wasm --token "$CARGO_REGISTRY_TOKEN"
          echo "[+] Sleeping 30s to allow crates.io index to update..."
          sleep 30

      - name: Publish grat (CLI)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "[+] Publishing grat to crates.io..."
          cargo publish -p grat --token "$CARGO_REGISTRY_TOKEN"

      - name: Verify crates.io publication status
        run: |
          echo "[+] Verifying crates on crates.io..."
          for crate in grat-core grat-wasm grat; do
            echo "Checking status for $crate..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: prism-ci" "https://crates.io/api/v1/crates/$crate" || true)
            echo "crates.io HTTP status for $crate: $HTTP_STATUS"
          done
          echo "[✓] Crates published and verified successfully!"
