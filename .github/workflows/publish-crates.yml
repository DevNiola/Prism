name: Publish crates

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - ".github/workflows/publish-crates.yml"
      - "scripts/publish-workspace-crates.py"
      - "scripts/verify-crate-published.sh"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  dry-run:
    name: Dry-run crate publishing
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Dry-run publish all workspace crates
        run: cargo publish --workspace --dry-run --all-features

  publish:
    name: Publish crates to crates.io
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    concurrency: crates-io-publication
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish and verify workspace crates
        id: publish
        run: python3 scripts/publish-workspace-crates.py
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Report partial publication
        if: failure() && steps.publish.outputs.published != ''
        uses: actions/github-script@v7
        env:
          PUBLISHED: ${{ steps.publish.outputs.published }}
          FAILED: ${{ steps.publish.outputs.failed }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner, repo,
              title: `Partial crates.io publication for ${context.payload.release.tag_name}`,
              body: `Cargo reported successful publication for: ${process.env.PUBLISHED}.\n\nPublication or verification failed for ${process.env.FAILED}. Remaining crates were skipped. Check crates.io and the [workflow logs](${run}) before resuming.`
            });
