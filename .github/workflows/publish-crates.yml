name: Publish crates

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - ".github/workflows/publish-crates.yml"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  dry-run:
    name: Dry-run crate publishing
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Dry-run publish all workspace crates
        run: cargo publish --workspace --dry-run

  publish:
    name: Publish crates to crates.io
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish grat-core
        run: cargo publish -p grat-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Verify grat-core publication
        run: bash scripts/verify-crate-published.sh grat-core

      - name: Publish grat-cli
        run: cargo publish -p grat-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Verify grat-cli publication
        run: bash scripts/verify-crate-published.sh grat-cli

      - name: Publish grat-wasm
        run: cargo publish -p grat-wasm
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Verify grat-wasm publication
        run: bash scripts/verify-crate-published.sh grat-wasm