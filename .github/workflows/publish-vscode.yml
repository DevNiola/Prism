name: Publish VS Code Extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: 'Publish to VS Code Marketplace'
        required: true
        type: boolean
        default: true

jobs:
  publish-vscode:
    name: Package and Publish VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VS Code extension bundle
        run: pnpm --filter grat-vscode build

      - name: Install @vscode/vsce CLI
        run: npm install -g @vscode/vsce

      - name: Package extension (.vsix)
        working-directory: extensions/vscode
        run: vsce package --no-git-tag-version --out ../../grat-vscode.vsix

      - name: Upload .vsix bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: grat-vscode-vsix
          path: grat-vscode.vsix

      - name: Attach .vsix to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" grat-vscode.vsix --clobber || echo "No release tag found or release upload skipped"

      - name: Publish to VS Code Marketplace
        if: (github.event_name == 'release' || inputs.publish_marketplace == true) && env.VSCE_PAT != ''
        working-directory: extensions/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: vsce publish -p "$VSCE_PAT" --no-git-tag-version
