name: CI
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
env:
  CARGO_TERM_COLOR: always
jobs:
  rust_checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache"

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Format code
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all

      - name: Build
        run: cargo build --workspace --all-targets --all-features

      - name: Lint taxonomy TOML
        run: bash scripts/lint_taxonomy.sh

      - name: Run tests and generate Rust coverage
        run: cargo tarpaulin --workspace --all-targets --all-features --out lcov --output-dir coverage

      - name: Upload Rust coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: rust
          name: rust-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  node_checks:
    name: Node & Web Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript tests and generate coverage
        run: pnpm --filter grat-server test:coverage

      - name: Upload TypeScript coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./apps/server/coverage/lcov.info
          flags: typescript
          name: typescript-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build Web
        run: pnpm run build:web
      - name: Build Server
        run: pnpm run build:server
      - name: Build VSCode Extension
        run: pnpm run build:vscode
        continue-on-error: true # Might require vsce or specific environment
