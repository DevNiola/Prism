name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - name: Install cargo-audit (with SARIF support)
        run: cargo install cargo-audit --features sarif --locked
      - name: Audit Rust dependencies (deny warnings)
        run: cargo audit --deny warnings
      - name: Generate SARIF report
        if: always()
        run: cargo audit --json 2>/dev/null | python3 -c "
import json, sys
audit = json.load(sys.stdin)
vulns = audit.get('vulnerabilities', {}).get('list', [])
results = []
for v in vulns:
    adv = v.get('advisory', {})
    results.append({
        'ruleId': adv.get('id', 'RUSTSEC-UNKNOWN'),
        'message': {'text': adv.get('title', 'Unknown vulnerability')},
        'locations': [{'physicalLocation': {'artifactLocation': {'uri': 'Cargo.lock'}}}],
        'level': 'error'
    })
sarif = {
    'version': '2.1.0',
    '\$schema': 'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json',
    'runs': [{'tool': {'driver': {'name': 'cargo-audit', 'version': '0.21', 'rules': []}}, 'results': results}]
}
print(json.dumps(sarif))
" > cargo-audit.sarif 2>/dev/null || echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"cargo-audit","version":"0.21"}},"results":[]}]}' > cargo-audit.sarif
      - name: Upload Rust audit SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cargo-audit.sarif
          category: cargo-audit

  javascript-audit:
    name: JavaScript dependency audit (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - apps/web
          - apps/server
          - extensions/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit ${{ matrix.workspace }} dependencies
        run: pnpm --filter "./$(echo '${{ matrix.workspace }}')" audit --audit-level high
        continue-on-error: false
      - name: Generate SARIF report for ${{ matrix.workspace }}
        if: always()
        run: |
          set -euo pipefail
          WORKSPACE="${{ matrix.workspace }}"
          SAFE_NAME=$(echo "$WORKSPACE" | tr '/' '-')
          pnpm --filter "./$WORKSPACE" audit --json 2>/dev/null > "pnpm-audit-${SAFE_NAME}.json" || true
          python3 -c "
import json, sys, os
safe = os.environ.get('SAFE_NAME', 'workspace')
ws = os.environ.get('WORKSPACE', '.')
fname = f'pnpm-audit-{safe}.json'
try:
    with open(fname) as f:
        audit = json.load(f)
except Exception:
    audit = {}
advisories = audit.get('advisories', {})
results = []
for adv_id, adv in advisories.items():
    results.append({
        'ruleId': str(adv.get('id', adv_id)),
        'message': {'text': adv.get('title', 'Unknown vulnerability')},
        'locations': [{'physicalLocation': {'artifactLocation': {'uri': f'{ws}/package.json'}}}],
        'level': 'error' if adv.get('severity') in ('high', 'critical') else 'warning'
    })
sarif = {
    'version': '2.1.0',
    '\$schema': 'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json',
    'runs': [{'tool': {'driver': {'name': 'pnpm-audit', 'version': '1.0'}}, 'results': results}]
}
with open(f'pnpm-audit-{safe}.sarif', 'w') as out:
    json.dump(sarif, out)
print(f'Generated pnpm-audit-{safe}.sarif with {len(results)} finding(s)')
" 2>/dev/null
        env:
          WORKSPACE: ${{ matrix.workspace }}
          SAFE_NAME: ${{ matrix.workspace != '' && format('{0}', matrix.workspace) }}
      - name: Upload ${{ matrix.workspace }} audit SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pnpm-audit-${{ matrix.workspace == 'apps/web' && 'apps-web' || matrix.workspace == 'apps/server' && 'apps-server' || 'extensions-vscode' }}.sarif
          category: pnpm-audit-${{ matrix.workspace == 'apps/web' && 'apps-web' || matrix.workspace == 'apps/server' && 'apps-server' || 'extensions-vscode' }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - rust
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  trivy:
    name: Container scan (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: server
            dockerfile: apps/server/Dockerfile
            context: .
          - app: web
            dockerfile: apps/web/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        if: hashFiles(matrix.dockerfile) != ''
        run: |
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --tag "prism-${{ matrix.app }}:security-scan" \
            "${{ matrix.context }}"
      - name: Scan image with Trivy
        if: hashFiles(matrix.dockerfile) != ''
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: prism-${{ matrix.app }}:security-scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
