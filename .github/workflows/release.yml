name: Continuous Deployment & Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run build (compile and verify artifacts without publishing release)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # 1. Build CLI Binaries for 5 Architectures
  # ===========================================================================
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: prism-x86_64-unknown-linux-gnu.tar.gz
            binary: prism
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: prism-aarch64-unknown-linux-gnu.tar.gz
            binary: prism
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            archive: prism-x86_64-apple-darwin.tar.gz
            binary: prism
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: prism-aarch64-apple-darwin.tar.gz
            binary: prism
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: prism-x86_64-pc-windows-msvc.zip
            binary: prism.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cli-${{ matrix.target }}"

      - name: Install cross compiler (Linux ARM64)
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build CLI binary (native)
        if: matrix.use_cross != true
        run: cargo build --release --bin prism --target ${{ matrix.target }}

      - name: Build CLI binary (cross)
        if: matrix.use_cross == true
        run: cross build --release --bin prism --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          tar -czvf ${{ matrix.archive }} -C dist ${{ matrix.binary }}

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          7z a -tzip ${{ matrix.archive }} ./dist/${{ matrix.binary }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  # ===========================================================================
  # 2. Build Web Application Static Bundle
  # ===========================================================================
  build-web:
    name: Build Web App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build taxonomy & web app
        run: pnpm run build:web

      - name: Package web application
        run: |
          tar -czvf prism-web.tar.gz -C apps/web .next

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-web.tar.gz
          path: prism-web.tar.gz
          if-no-files-found: error

  # ===========================================================================
  # 3. Build & Publish WASM Package
  # ===========================================================================
  build-wasm:
    name: Build & Package WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "wasm-cache"

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack --version

      - name: Build WASM package (web target)
        run: wasm-pack build crates/wasm --target web --release

      - name: Package WASM artifact
        run: |
          tar -czvf prism-wasm.tar.gz -C crates/wasm/pkg .

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-wasm.tar.gz
          path: prism-wasm.tar.gz

      - name: Publish to npm (if NPM_TOKEN is set and not dry run)
        if: ${{ !inputs.dry_run && env.NPM_TOKEN != '' }}
        working-directory: crates/wasm/pkg
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ===========================================================================
  # 4. Create GitHub Release with Attached Assets
  # ===========================================================================
  release:
    name: Create GitHub Release
    needs: [build-cli, build-web, build-wasm]
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
