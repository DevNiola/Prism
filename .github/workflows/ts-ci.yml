name: TypeScript CI

on:
  push:
    branches: ["main", "master"]
    paths:
      - "apps/web/**"
      - "apps/server/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/ts-ci.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "apps/web/**"
      - "apps/server/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/ts-ci.yml"

jobs:
  ts-ci:
    name: TypeScript Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint — web
        run: pnpm --filter grat-web lint

      - name: Lint — server
        run: pnpm --filter grat-server lint

      - name: Type check — web
        run: pnpm --filter grat-web typecheck

      - name: Type check — server
        run: pnpm --filter grat-server typecheck

      - name: Build — web
        run: pnpm --filter grat-web build

      - name: Build — server
        run: pnpm --filter grat-server build

      - name: Test — server
        run: pnpm --filter grat-server test
        continue-on-error: false
