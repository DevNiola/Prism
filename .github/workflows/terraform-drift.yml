name: Terraform Drift Detection

on:
  schedule:
    # Runs every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Detect Terraform Drift
    runs-on: ubuntu-latest

    env:
      TF_DIR: deploy/terraform
      TF_VERSION: "1.9.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform Plan (drift check)
        id: plan
        working-directory: ${{ env.TF_DIR }}
        # -detailed-exitcode exits 0 = no changes, 1 = error, 2 = changes detected
        run: |
          set +e
          terraform plan \
            -input=false \
            -detailed-exitcode \
            -var="redis_auth_token=${{ secrets.REDIS_AUTH_TOKEN }}" \
            -var="domain_name=${{ secrets.DOMAIN_NAME }}" \
            -var="route53_zone_id=${{ secrets.ROUTE53_ZONE_ID }}" \
            -var="server_image=${{ secrets.SERVER_IMAGE }}" \
            -var="web_image=${{ secrets.WEB_IMAGE }}" \
            -out=tfplan.binary 2>&1 | tee plan_output.txt
          PLAN_EXIT=$?
          echo "exit_code=$PLAN_EXIT" >> "$GITHUB_OUTPUT"
          set -e

      - name: Convert plan to readable text
        if: steps.plan.outputs.exit_code == '2'
        working-directory: ${{ env.TF_DIR }}
        run: terraform show -no-color tfplan.binary > plan_readable.txt 2>&1 || true

      - name: Comment drift on open issue (if exists) or open new issue
        if: steps.plan.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planText = fs.existsSync('${{ env.TF_DIR }}/plan_readable.txt')
              ? fs.readFileSync('${{ env.TF_DIR }}/plan_readable.txt', 'utf8').slice(0, 60000)
              : '(plan output unavailable)';

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## ⚠️ Terraform Drift Detected',
              '',
              `A scheduled drift check found differences between the Terraform state and live AWS infrastructure.`,
              `Run: ${runUrl}`,
              '',
              '<details>',
              '<summary>Plan output</summary>',
              '',
              '```hcl',
              planText,
              '```',
              '</details>',
              '',
              '_This issue was opened automatically by the [Terraform Drift Detection workflow](.github/workflows/terraform-drift.yml)._',
            ].join('\n');

            const label = 'terraform-drift';

            // Ensure the label exists
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'e4e669',
                description: 'Terraform state has drifted from live infrastructure',
              });
            } catch (_) {
              // Label likely already exists
            }

            // Check for an existing open drift issue
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 1,
            });

            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `### New drift detected — ${new Date().toISOString()}\n\n${body}`,
              });
              core.notice(`Updated existing drift issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '[DevOps] Terraform drift detected',
                body,
                labels: ['bug', label, 'devops'],
              });
              core.notice(`Opened new drift issue #${created.data.number}`);
            }

      - name: Close resolved drift issues
        if: steps.plan.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'terraform-drift';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 10,
            });

            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ Drift resolved — `terraform plan` reports no changes as of this run.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: Fail workflow when plan errors
        if: steps.plan.outputs.exit_code == '1'
        run: |
          echo "terraform plan exited with an error. Check the logs above."
          exit 1
