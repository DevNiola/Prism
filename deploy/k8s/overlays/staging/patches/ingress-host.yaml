apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prism-ingress
spec:
  tls:
    - hosts:
        - staging.prism.example.com
      secretName: prism-staging-tls-cert
  rules:
    - host: staging.prism.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: prism-server
                port:
                  number: 3001
          - path: /health
            pathType: Exact
            backend:
              service:
                name: prism-server
                port:
                  number: 3001
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: prism-server
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prism-web
                port:
                  number: 3000
