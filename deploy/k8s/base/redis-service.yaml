apiVersion: v1
kind: Service
metadata:
  name: prism-redis
  labels:
    app.kubernetes.io/name: prism
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: prism
    app.kubernetes.io/component: redis
---
apiVersion: v1
kind: Service
metadata:
  name: prism-redis-headless
  labels:
    app.kubernetes.io/name: prism
    app.kubernetes.io/component: redis
spec:
  clusterIP: None
  ports:
    - port: 6379
      name: redis
  selector:
    app.kubernetes.io/name: prism
    app.kubernetes.io/component: redis
