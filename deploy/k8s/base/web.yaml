apiVersion: apps/v1
kind: Deployment
metadata:
  name: prism-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prism-web
  template:
    metadata:
      labels:
        app: prism-web
    spec:
      containers:
        - name: web
          image: ghcr.io/devniola/prism-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: prism-web
  ports:
    - name: http
      port: 3000
      targetPort: http
