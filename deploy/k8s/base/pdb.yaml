apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: prism-server-pdb
  labels:
    app.kubernetes.io/name: prism
    app.kubernetes.io/component: server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prism
      app.kubernetes.io/component: server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: prism-web-pdb
  labels:
    app.kubernetes.io/name: prism
    app.kubernetes.io/component: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prism
      app.kubernetes.io/component: web
