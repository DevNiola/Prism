apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prism-redis-allow-server
  labels:
    app.kubernetes.io/name: prism
    app.kubernetes.io/component: redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prism
      app.kubernetes.io/component: redis
  policyTypes:
    - Ingress
  ingress:
    # Only the server pods may connect to Redis on port 6379.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prism
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 6379
