apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prism
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - prism.local
      secretName: prism-tls
  rules:
    - host: prism.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  name: http
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
