apiVersion: v1
kind: ConfigMap
metadata:
  name: prism-config
  labels:
    app.kubernetes.io/name: prism
    app.kubernetes.io/component: config
data:
  NODE_ENV: "production"
  PORT: "3001"
  REDIS_URL: "redis://prism-redis:6379"
  LOG_LEVEL: "info"
  AI_API_BASE_URL: "https://api.openai.com/v1"
  AI_MODEL: "gpt-4o-mini"
  AI_MAX_TOKENS_PER_REQUEST: "2048"
  AI_TEMPERATURE: "0.2"
  AI_TIMEOUT_MS: "30000"
  AI_HOURLY_TOKEN_LIMIT: "100000"
  AI_DAILY_TOKEN_LIMIT: "1000000"
  AI_MAX_CONCURRENT: "5"
  CACHE_DECODE_TTL: "86400"
  CACHE_PROFILE_TTL: "3600"
  DEDUP_WINDOW_MS: "10000"
  NEXT_PUBLIC_API_URL: "/api"
