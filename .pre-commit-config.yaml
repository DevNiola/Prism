repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: clippy
        name: clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --check
        language: system
        types_or: [ts, tsx]
      - id: eslint
        name: eslint
        entry: pnpm lint
        language: system
        types_or: [ts, tsx]
        pass_filenames: false